name: Code quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
      - name: Setup Biome
        uses: biomejs/setup-biome@v2.7.1
        with:
          version: latest
      - name: Run Biome
        run: biome ci .
